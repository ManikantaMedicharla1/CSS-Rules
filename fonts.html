<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>CSS Fonts</title>
</head>
<body>
    <p style="font-family:Trebuchet MS, monotype coursiva, courier;">changed font family</p>
    <P style="font-style:italic;">This is italic</P>
    <p style="font-variant:small-caps;">This is the small caps Example</p>
    <p style="font-weight:bold;">This is the Bold</p>
    <p style="font-size:30px;">This font size is 30px</p>
    <p style="font-size:small;">This font is small</p>
    <p style="font-size:large;">This is the large</p>
    <p style="font:italic small-caps bold 15px georgia;">This shorter way to style the text</p>
</body>
</html>
